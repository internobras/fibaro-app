<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FÍBARO — Comparador de Tarifas · Sanlúcar de Barrameda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- SheetJS para lectura de .xlsx en el navegador -->
<script>
window.addEventListener('error', function(e){
  if(document.getElementById('fibaro-runtime-error')) return;
  var box=document.createElement('div');
  box.id='fibaro-runtime-error';
  box.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;z-index:99999;background:#2a1215;color:#ffb4ab;border:1px solid #5c2b2e;border-radius:12px;padding:14px 16px;font:13px/1.5 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)';
  box.innerHTML='<strong style="display:block;margin-bottom:6px;color:#fff">Error al cargar la web</strong>' +
    'Se ha producido un fallo de JavaScript. Revisa la consola del navegador (F12).<br>' +
    '<span style="opacity:.9">' + (e.message || 'Error desconocido') + '</span>';
  document.body.appendChild(box);
}, true);
window.addEventListener('DOMContentLoaded', function(){
  setTimeout(function(){
    if(!window.React || !window.ReactDOM || !window.Babel){
      var box=document.createElement('div');
      box.style.cssText='position:fixed;left:16px;right:16px;top:16px;z-index:99999;background:#fff4e5;color:#663c00;border:1px solid #ffcc80;border-radius:12px;padding:14px 16px;font:13px/1.5 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.12)';
      box.innerHTML='<strong style="display:block;margin-bottom:6px">Faltan librerías externas</strong>Necesitas conexión a internet para cargar React, Babel y el lector de Excel en esta versión.';
      document.body.appendChild(box);
    }
  },1200);
});
</script>

<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>
:root{
  --ink:#030B1A;--ink-2:#071428;--ink-3:#0D1E3A;
  --blue:#2563EB;--blue-lt:#3B82F6;--blue-glow:rgba(37,99,235,.35);
  --cyan:#06B6D4;--white:#FAFBFF;--off-white:#F1F5FB;
  --border-dark:rgba(255,255,255,.07);--border-light:rgba(10,22,40,.08);
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --transition:all .26s cubic-bezier(.25,.46,.45,.94);
  --op-mm:#EA580C;--op-jazz:#DC2626;--op-simyo:#0891B2;--op-pepe:#7C3AED;--op-demo:#64748B;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--white);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:var(--ink)}::-webkit-scrollbar-thumb{background:var(--blue);border-radius:4px}

/* ── Typography ── */
.t-display{font-size:clamp(2.6rem,6vw,5rem);font-weight:800;line-height:1.08;letter-spacing:-.035em}
.t-h1{font-size:clamp(1.8rem,4vw,3.4rem);font-weight:800;line-height:1.12;letter-spacing:-.028em}
.t-h2{font-size:clamp(1.4rem,2.8vw,2.4rem);font-weight:700;line-height:1.2;letter-spacing:-.02em}
.t-h3{font-size:clamp(1rem,1.8vw,1.3rem);font-weight:600;line-height:1.35}
.t-body-lg{font-size:clamp(.95rem,1.4vw,1.08rem);line-height:1.7}
.t-body{font-size:.93rem;line-height:1.65}
.t-label{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.t-muted{opacity:.6}
.grad-blue{background:linear-gradient(135deg,#60A5FA,#06B6D4 55%,#818CF8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* ── Layout ── */
.container{max-width:1200px;margin:0 auto;padding:0 28px}
.section{padding:96px 0}.section-sm{padding:56px 0}
@media(max-width:768px){.section{padding:56px 0}.section-sm{padding:36px 0}.container{padding:0 16px}}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:100px;font-family:var(--font);font-weight:600;font-size:.88rem;cursor:pointer;border:none;transition:var(--transition);text-decoration:none;white-space:nowrap;line-height:1}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 4px 18px var(--blue-glow)}
.btn-primary:hover{background:#1D4ED8;transform:translateY(-2px);box-shadow:0 10px 32px rgba(37,99,235,.5)}
.btn-ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.12);transform:translateY(-2px)}
.btn-outline{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.btn-outline:hover{background:var(--blue);color:#fff;transform:translateY(-2px)}
.btn-sm{padding:9px 18px;font-size:.8rem}
.btn-lg{padding:17px 34px;font-size:.98rem}
.btn-icon{padding:9px;border-radius:10px}
.btn-white{background:#fff;color:var(--ink);box-shadow:0 4px 18px rgba(0,0,0,.12)}
.btn-white:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(0,0,0,.18)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* ── Nav ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:90;transition:var(--transition)}
.nav-scrolled{background:rgba(3,11,26,.96);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-dark)}
.nav-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:20px 32px}
.logo{font-size:1.4rem;font-weight:800;color:#fff;letter-spacing:-.04em;text-decoration:none}
.logo-accent{color:var(--cyan)}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none}
.nav-links a{color:rgba(255,255,255,.65);text-decoration:none;font-size:.87rem;font-weight:500;transition:color .2s}
.nav-links a:hover{color:#fff}
.nav-ctas{display:flex;gap:10px}
@media(max-width:900px){.nav-links{display:none}.nav-inner{padding:15px 18px}}

/* ── Import Banner ── */
.import-banner{background:var(--ink-2);border-bottom:1px solid var(--border-dark);padding:12px 0;position:sticky;top:0;z-index:89}
.import-banner-inner{max-width:1280px;margin:0 auto;padding:0 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.import-demo-badge{background:rgba(234,179,8,.15);border:1px solid rgba(234,179,8,.3);color:#FDE047;padding:3px 10px;border-radius:6px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.import-live-badge{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.25);color:#4ADE80;padding:3px 10px;border-radius:6px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;flex-shrink:0}
.import-text{font-size:.82rem;color:rgba(255,255,255,.7);flex:1}
.import-text strong{color:#fff}
.import-stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.import-stat{font-size:.75rem;color:rgba(255,255,255,.55);display:flex;align-items:center;gap:5px}
.import-stat-val{color:rgba(255,255,255,.9);font-weight:700}
.import-warn{font-size:.75rem;color:#FCA5A5;background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.2);padding:4px 10px;border-radius:6px}
.import-file-input{display:none}
@media(max-width:600px){.import-banner-inner{gap:10px}.import-stats{display:none}}

/* ── Hero ── */
.hero{min-height:100vh;background:var(--ink);position:relative;display:flex;align-items:center;overflow:hidden;padding-top:80px}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(37,99,235,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.055) 1px,transparent 1px);background-size:64px 64px}
.hero-glow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(37,99,235,.2) 0%,transparent 65%);top:-200px;right:-150px;pointer-events:none}
.hero-glow-2{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.12) 0%,transparent 65%);bottom:-100px;left:-80px;pointer-events:none}
.hero-inner{max-width:1200px;margin:0 auto;padding:0 28px;display:grid;grid-template-columns:1fr 400px;gap:64px;align-items:center}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);border-radius:100px;color:#93C5FD;font-size:.73rem;font-weight:700;margin-bottom:24px;letter-spacing:.04em}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.hero-ops{display:flex;gap:8px;margin-top:36px;padding-top:28px;border-top:1px solid var(--border-dark);flex-wrap:wrap;align-items:center}
.hero-ops-label{font-size:.72rem;color:rgba(255,255,255,.4);margin-right:4px}
.op-pill{padding:5px 12px;border-radius:8px;font-size:.75rem;font-weight:700;letter-spacing:.04em}
@media(max-width:900px){.hero-inner{grid-template-columns:1fr;gap:32px;text-align:center}.hero-ctas{justify-content:center}.hero-ops{justify-content:center}.hero-visual-wrap{display:none}}
@media(max-width:600px){.hero-inner{padding:0 16px}}

/* ── Operators visual ── */
.ops-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.op-card{border-radius:16px;padding:20px;border:1.5px solid var(--border-dark);background:rgba(255,255,255,.03);text-align:center;transition:var(--transition)}
.op-card:hover{border-color:currentColor;background:rgba(255,255,255,.05);transform:translateY(-3px)}
.op-logo-text{font-size:1rem;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
.op-count{font-size:.72rem;color:rgba(255,255,255,.4)}
@media(max-width:768px){.ops-grid{grid-template-columns:repeat(2,1fr)}}

/* ── Catalog ── */
.catalog-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;margin-bottom:24px}
.catalog-live-wrap{display:flex;align-items:center;gap:8px;font-size:.75rem;color:#64748B}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22C55E;flex-shrink:0}
.live-dot.demo{background:#F59E0B}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px;align-items:center}
.filter-btn{padding:8px 18px;border-radius:100px;font-family:var(--font);font-weight:600;font-size:.8rem;cursor:pointer;border:1.5px solid var(--border-light);background:#fff;color:#64748B;transition:var(--transition)}
.filter-btn.active,.filter-btn:hover{border-color:var(--blue);color:var(--blue);background:rgba(37,99,235,.06)}
.filter-search{flex:1;min-width:180px;max-width:280px;padding:9px 14px;border-radius:10px;border:1.5px solid var(--border-light);font-family:var(--font);font-size:.85rem;outline:none;background:#fff}
.filter-search:focus{border-color:var(--blue)}
.plans-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:start}
.plans-grid.cols-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.plans-grid,.plans-grid.cols-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.plans-grid,.plans-grid.cols-4{grid-template-columns:1fr}}
.empty-state{text-align:center;padding:64px 24px;color:#94A3B8}

/* ── Plan Card ── */
.plan-card{border-radius:22px;padding:26px;transition:var(--transition);position:relative;display:flex;flex-direction:column;background:#fff;border:1.5px solid var(--border-light);box-shadow:0 2px 16px rgba(0,0,0,.05)}
.plan-card:hover{transform:translateY(-5px);box-shadow:0 16px 48px rgba(0,0,0,.1)}
.plan-card.featured{box-shadow:0 20px 56px rgba(37,99,235,.32)}
.plan-card.demo-card{border-style:dashed;border-color:rgba(100,116,139,.3);background:rgba(248,250,252,.8)}

.op-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:8px;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-bottom:14px;width:fit-content}
.op-badge.MASMOVIL{background:rgba(234,88,12,.1);color:var(--op-mm);border:1px solid rgba(234,88,12,.2)}
.op-badge.JAZZTEL{background:rgba(220,38,38,.1);color:var(--op-jazz);border:1px solid rgba(220,38,38,.2)}
.op-badge.SIMYO{background:rgba(8,145,178,.1);color:var(--op-simyo);border:1px solid rgba(8,145,178,.2)}
.op-badge.PEPEPHONE{background:rgba(124,58,237,.1);color:var(--op-pepe);border:1px solid rgba(124,58,237,.2)}
.op-badge.DEMO{background:rgba(100,116,139,.1);color:var(--op-demo);border:1px solid rgba(100,116,139,.2)}

.demo-watermark{position:absolute;top:14px;right:14px;background:rgba(234,179,8,.12);border:1px solid rgba(234,179,8,.25);color:#CA8A04;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}

.plan-name{font-size:1.05rem;font-weight:800;color:var(--ink);line-height:1.25;margin-bottom:2px}
.plan-sub{font-size:.75rem;color:#94A3B8;margin-bottom:14px;text-transform:capitalize}
.plan-speed-row{display:flex;align-items:baseline;gap:3px;margin-bottom:2px}
.plan-speed-num{font-size:2rem;font-weight:800;line-height:1;color:var(--ink);letter-spacing:-.03em}
.plan-speed-unit{font-size:.8rem;color:#94A3B8;font-weight:500}
.plan-lines-row{font-size:.78rem;color:#64748B;margin-bottom:14px}
.plan-price-block{margin:14px 0 18px;padding:14px;border-radius:12px;background:var(--off-white)}
.plan-price-promo{display:flex;align-items:baseline;gap:3px;margin-bottom:4px}
.plan-price-promo-sym{font-size:.9rem;font-weight:700;color:var(--blue)}
.plan-price-promo-num{font-size:1.7rem;font-weight:800;color:var(--blue);line-height:1;letter-spacing:-.025em}
.plan-price-promo-per{font-size:.75rem;color:#94A3B8;font-weight:500}
.plan-price-note{font-size:.72rem;color:#94A3B8;line-height:1.4}
.plan-price-final{display:flex;align-items:baseline;gap:3px;margin-top:4px}
.plan-price-final-num{font-size:1.2rem;font-weight:700;color:#374151}
.plan-price-iva{font-size:.7rem;color:#94A3B8;margin-left:4px}

.plan-divider{height:1px;background:var(--border-light);margin:0 0 16px}
.plan-feats{list-style:none;margin-bottom:18px;flex:1;display:flex;flex-direction:column;gap:5px}
.plan-feats li{display:flex;align-items:flex-start;gap:8px;font-size:.83rem;color:#374151;line-height:1.4}
.plan-feat-check{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.58rem;font-weight:800;margin-top:1px}
.plan-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.plan-tag{padding:3px 10px;border-radius:6px;font-size:.68rem;font-weight:600;background:var(--off-white);color:#64748B}
.plan-tag.no-perm{background:rgba(16,185,129,.08);color:#059669}
.plan-tag.featured-tag{background:rgba(37,99,235,.08);color:var(--blue)}
.plan-card-ctas{display:flex;gap:8px;flex-wrap:wrap}
.plan-card-ctas .btn{flex:1;justify-content:center;font-size:.8rem}
.plan-conds{font-size:.68rem;color:#CBD5E1;margin-top:10px;line-height:1.5}
.promo-ribbon{background:linear-gradient(135deg,#F59E0B,#EF4444);color:#fff;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:0 10px 0 10px;position:absolute;top:0;right:0}

/* ── AI Panel ── */
.ai-panel{position:fixed;right:0;top:0;bottom:0;width:min(480px,100vw);background:var(--ink);border-left:1px solid var(--border-dark);z-index:200;display:flex;flex-direction:column;transition:transform .4s cubic-bezier(.25,.46,.45,.94);box-shadow:-24px 0 80px rgba(0,0,0,.5)}
.ai-panel-closed{transform:translateX(100%)}
.ai-panel-open{transform:translateX(0)}
.ai-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:199}
.ai-header{padding:22px 22px 18px;border-bottom:1px solid var(--border-dark);display:flex;align-items:center;gap:12px}
.ai-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--cyan));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.ai-bubble{padding:13px 16px;border-radius:14px;font-size:.88rem;line-height:1.6;max-width:92%}
.ai-bubble-bot{background:rgba(255,255,255,.07);color:rgba(255,255,255,.88);align-self:flex-start;border-bottom-left-radius:4px}
.ai-bubble-user{background:var(--blue);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ai-opts{display:flex;flex-wrap:wrap;gap:7px}
.ai-opt{padding:9px 15px;border-radius:100px;border:1.5px solid rgba(255,255,255,.14);background:transparent;color:rgba(255,255,255,.8);font-family:var(--font);font-size:.8rem;font-weight:600;cursor:pointer;transition:var(--transition)}
.ai-opt:hover{border-color:var(--blue);background:rgba(37,99,235,.2);color:#fff}
.ai-footer{padding:14px 22px;border-top:1px solid var(--border-dark)}
.ai-typing span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4);display:inline-block;animation:typing .9s ease-in-out infinite}
.ai-typing span:nth-child(2){animation-delay:.15s}
.ai-typing span:nth-child(3){animation-delay:.3s}
.ai-rec-card{border-radius:14px;background:linear-gradient(145deg,rgba(37,99,235,.14),rgba(6,182,212,.08));border:1px solid rgba(37,99,235,.22);padding:18px}

/* ── Lines Calculator Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(10px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:#fff;border-radius:24px;padding:40px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;animation:fadeUp .28s ease}
.lines-calc-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
.lines-summary{background:var(--off-white);border-radius:12px;padding:18px;margin:16px 0}
.lines-sum-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:.88rem;border-bottom:1px solid var(--border-light)}
.lines-sum-row:last-child{border:none;font-weight:700;font-size:1rem;color:var(--ink)}
.lines-options{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.lines-opt-card{padding:14px 16px;border-radius:12px;border:1.5px solid var(--border-light);cursor:pointer;transition:var(--transition)}
.lines-opt-card.selected,.lines-opt-card:hover{border-color:var(--blue);background:rgba(37,99,235,.04)}
.revision-warn{background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.25);border-radius:10px;padding:14px;font-size:.83rem;color:#92400E;line-height:1.6}

/* ── Preorder Modal ── */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:.82rem;font-weight:600;margin-bottom:5px;color:#374151}
.form-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #E2E8F0;font-family:var(--font);font-size:.9rem;outline:none;transition:border-color .2s;background:#FAFBFF;color:var(--ink)}
.form-input:focus{border-color:var(--blue)}
.form-input::placeholder{color:#CBD5E1}
textarea.form-input{resize:vertical;min-height:72px}
.preorder-plan-badge{display:flex;align-items:center;gap:10px;background:var(--off-white);border-radius:12px;padding:12px 16px;margin-bottom:20px}
.modal-note{font-size:.75rem;color:#94A3B8;background:#F8FAFC;border-radius:10px;padding:12px 14px;margin-top:14px;line-height:1.55}

/* ── Process / Trust / Testimonials ── */
.trust-bar{background:var(--ink-2);border-top:1px solid var(--border-dark);border-bottom:1px solid var(--border-dark);padding:20px 0}
.trust-items{display:flex;flex-wrap:wrap;gap:0}
.trust-item{display:flex;align-items:center;gap:10px;padding:8px 28px;border-right:1px solid var(--border-dark);flex-shrink:0}
.trust-item:last-child{border-right:none}
.trust-icon{width:30px;height:30px;border-radius:50%;background:rgba(37,99,235,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.trust-text{font-size:.8rem;color:rgba(255,255,255,.7)}
.trust-text strong{color:#fff;display:block;font-weight:700;font-size:.85rem}
@media(max-width:768px){.trust-items{flex-direction:column;gap:0;padding:0 16px}.trust-item{border-right:none;border-bottom:1px solid var(--border-dark);padding:12px 0}}

// ── parseExcel — lee el Excel maestro desde el navegador ──
window.parseExcel = async function(file) {
  const ab = await file.arrayBuffer();
  const wb = XLSX.read(ab, { type:'array', cellDates:true });
  const warnings = [];
  const norm = s => s?.toString().trim().toLowerCase() || '';

  // Helper: sheet to JSON, defval ''
  const toJson = name => {
    if (!wb.Sheets[name]) { warnings.push(`Hoja "${name}" no encontrada`); return []; }
    return XLSX.utils.sheet_to_json(wb.Sheets[name], { defval:'' });
  };

  // 01_CATALOGO_TARIFAS — filtrar visible_web=sí Y (admin_ok_publicar=si|sí)
  const allCat = toJson('01_CATALOGO_TARIFAS');
  const plans = allCat.filter(r =>
    norm(r.visible_web) === 'sí' &&
    ['si','sí'].includes(norm(r.admin_ok_publicar))
  );
  if (plans.length === 0 && allCat.length > 0) warnings.push('Ninguna tarifa tiene admin_ok_publicar aprobado. Revisa el Excel.');

  // 03_PROMOCIONES
  const promos = toJson('03_PROMOCIONES').filter(r =>
    norm(r.visible_web) === 'sí' && ['si','sí'].includes(norm(r.admin_ok_publicar))
  );

  // 04_SERVICIOS_EXTRA
  const extras = toJson('04_SERVICIOS_EXTRA').filter(r =>
    norm(r.estado) === 'activa' && norm(r.visible_web) === 'sí'
  );

  // 04B_LINEAS_ADICIONALES — omitir fila de instrucción (id_tarifa==='INSTRUCCIÓN')
  const lineas = toJson('04B_LINEAS_ADICIONALES').filter(r =>
    r.id_linea_adicional && r.id_linea_adicional !== 'INSTRUCCIÓN' &&
    norm(r.estado) === 'activa' && norm(r.visible_web) === 'sí'
  );

  // 06_REGLAS_IA_BUSCADOR
  const rules = toJson('06_REGLAS_IA_BUSCADOR').filter(r => r.id_regla);

  const ops = {};
  plans.forEach(r => { const o = r.operador || 'Otro'; ops[o] = (ops[o]||0)+1; });

  return { plans, promos, extras, lineas, rules, warnings, stats:{ plans:plans.length, promos:promos.length, extras:extras.length, lineas:lineas.length }, operadores:ops };
};

// ── findLineasAdicionales — lógica con prioridad aplica_a_id_tarifa ──
window.findLineasAdicionales = function(plan, allLineas) {
  const planId = (plan.id_tarifa||'').trim();
  const familia = (plan.familia_tarifa||'').toLowerCase().trim();
  const subfamilia = (plan.subfamilia_tarifa||'').toLowerCase().trim();
  const operador = (plan.operador||'').toUpperCase().trim();
  const active = allLineas || [];

  const splitIds = str => (str||'').split(/;\s*/).map(s=>s.trim()).filter(Boolean);

  // Prioridad 1: coincidencia exacta por id_tarifa
  const byId = active.filter(l => splitIds(l.aplica_a_id_tarifa).includes(planId));
  if (byId.length > 0) return { lines: byId, matchType: 'id' };

  // Prioridad 2: familia + operador
  const byFam = active.filter(l =>
    (l.aplica_a_familia_tarifa||'').toLowerCase().trim() === familia && familia &&
    (l.operador||'').toUpperCase().trim() === operador
  );
  if (byFam.length > 0) return { lines: byFam, matchType: 'familia' };

  // Prioridad 3: subfamilia + operador
  const bySub = active.filter(l =>
    (l.aplica_a_subfamilia_tarifa||'').toLowerCase().trim() === subfamilia && subfamilia &&
    (l.operador||'').toUpperCase().trim() === operador
  );
  if (bySub.length > 0) return { lines: bySub, matchType: 'subfamilia' };

  // Prioridad 4: solo operador
  const byOp = active.filter(l => (l.operador||'').toUpperCase().trim() === operador);
  if (byOp.length > 0) return { lines: byOp, matchType: 'operador' };

  return { lines: [], matchType: 'none' };
};

<script type="text/babel">
/* inlined: fibaro-v2-tools.jsx */
// fibaro-v2-tools.jsx — AI Assistant, Lines Calculator, Preorder Modal

// ── AI Assistant V2 ──
function FibaroAIV2({ open, onClose, catalog, isDemoMode, onPreorder }) {
  const [step, setStep] = React.useState('intro');
  const [answers, setAnswers] = React.useState({});
  const [msgs, setMsgs] = React.useState([]);
  const [loading, setLoading] = React.useState(false);
  const [rec, setRec] = React.useState(null);
  const bodyRef = React.useRef(null);

  const addMsg = (role, text, opts) =>
    setMsgs(m => [...m, { role, text, opts }]);

  React.useEffect(() => {
    if (open && msgs.length === 0) {
      const intro = isDemoMode
        ? 'Hola, soy el asistente de FÍBARO. Cuando importes el catálogo real podré hacer recomendaciones precisas. Por ahora te haré las preguntas de perfil para que veas cómo funciona.'
        : 'Hola, soy el asistente de FÍBARO. Comparo tarifas reales de Jazztel, MASMOVIL, Pepephone y Simyo. En tres preguntas te digo cuál encaja mejor contigo.';
      setMsgs([{ role: 'bot', text: intro }]);
      setTimeout(() => nextStep('q1'), 500);
    }
  }, [open]);

  React.useEffect(() => {
    if (!open) {
      setTimeout(() => {
        setStep('intro'); setAnswers({}); setMsgs([]); setRec(null); setLoading(false);
      }, 420);
    }
  }, [open]);

  React.useEffect(() => {
    if (bodyRef.current) bodyRef.current.scrollTop = bodyRef.current.scrollHeight;
  }, [msgs, loading]);

  const questions = {
    q1: {
      text: '¿Cuántas personas vais a usar internet en casa?',
      opts: ['Solo yo', 'Somos 2', '3 o 4 personas', '5 o más personas'],
      key: 'personas', next: 'q2',
    },
    q2: {
      text: '¿Para qué lo usáis principalmente?',
      opts: ['Uso básico y redes sociales', 'Teletrabajo y videollamadas', 'Series y streaming intensivo', 'Gaming online'],
      key: 'uso', next: 'q3',
    },
    q3: {
      text: '¿Qué prioridad tienes?',
      opts: ['Pagar lo mínimo', 'Buen equilibrio calidad/precio', 'Máximo rendimiento'],
      key: 'prioridad', next: 'result',
    },
  };

  const nextStep = (s) => {
    setStep(s);
    if (questions[s]) addMsg('bot', questions[s].text);
  };

  const handleOpt = async (qKey, opt) => {
    addMsg('user', opt);
    const q = questions[qKey];
    const newAnswers = { ...answers, [q.key]: opt };
    setAnswers(newAnswers);

    if (q.next === 'result') {
      setStep('loading');
      setLoading(true);
      addMsg('bot', 'Analizando el catálogo…');
      await getRecommendation(newAnswers);
    } else {
      setTimeout(() => nextStep(q.next), 280);
    }
  };

  const getRecommendation = async (ans) => {
    const plans = catalog?.plans || [];
    const rules = catalog?.rules || [];

    // Try to match rules from 06_REGLAS_IA_BUSCADOR
    const ahorro = ans.prioridad?.includes('mínimo');
    const gaming = ans.uso?.includes('Gaming');
    const streaming = ans.uso?.includes('stream');
    const teletrabajo = ans.uso?.includes('Teletrabajo');
    const personas = ans.personas?.includes('5') ? 5 : ans.personas?.includes('3') ? 3 : ans.personas?.includes('2') ? 2 : 1;
    const premium = ans.prioridad?.includes('rendimiento');

    let matchedPlanIds = [];
    for (const rule of rules) {
      const ruleMatches =
        (ahorro && rule.ahorro === 'sí') ||
        (streaming && rule.streaming === 'sí') ||
        (gaming && rule.gaming === 'sí') ||
        (teletrabajo && rule.teletrabajo === 'sí') ||
        (premium && rule.premium === 'sí');
      if (ruleMatches) {
        const ids = [rule.tarifa_prioritaria_1, rule.tarifa_prioritaria_2, rule.tarifa_prioritaria_3].filter(Boolean);
        matchedPlanIds = [...matchedPlanIds, ...ids];
      }
    }

    // Find matching plans in catalog
    let candidates = matchedPlanIds.length > 0
      ? matchedPlanIds.map(id => plans.find(p => p.id_tarifa === id)).filter(Boolean)
      : [];

    // Fallback: filter by logic
    if (candidates.length === 0) {
      candidates = plans.filter(p => {
        if (!p.recomendable_ia || p.recomendable_ia.toLowerCase() !== 'sí') return false;
        const speed = parseInt(p.fibra_mb) || 0;
        const lineas = parseInt(p.num_lineas_incluidas) || 0;
        if (ahorro && parseFloat(p.precio_final) > 35) return false;
        if (gaming && speed < 600) return false;
        if (personas >= 4 && lineas < 2) return false;
        return true;
      }).slice(0, 3);
    }

    if (candidates.length === 0 && plans.length > 0) {
      candidates = plans.filter(p => p.recomendable_ia?.toLowerCase() === 'sí').slice(0, 2);
    }

    if (candidates.length === 0) {
      setLoading(false);
      setStep('noresult');
      addMsg('bot', isDemoMode
        ? 'En modo demo no puedo hacer una recomendación real. Importa el Excel maestro para activar el recomendador con datos de operadores reales.'
        : 'No he encontrado una tarifa que encaje claramente con tu perfil en el catálogo actual. Te recomiendo que nuestro equipo te asesore directamente. Puedes llamarnos al 633 671 657.');
      return;
    }

    // Use Claude to generate recommendation text
    const topPlan = candidates[0];
    const candidatesSummary = candidates.slice(0, 3).map(p =>
      `- ${p.marca_comercial||p.operador}: ${p.nombre_tarifa} | ${p.fibra_mb}Mb | ${p.num_lineas_incluidas} líneas | €${p.precio_final}/mes`
    ).join('\n');

    const prompt = `Eres el asesor comercial de FÍBARO, una empresa de asesoramiento de telecomunicaciones en Sanlúcar de Barrameda. FÍBARO no es operador; compara y tramita tarifas de distintas compañías.

PERFIL DEL USUARIO:
- Personas en casa: ${ans.personas}
- Uso principal: ${ans.uso}
- Prioridad: ${ans.prioridad}

TARIFAS CANDIDATAS DEL CATÁLOGO OFICIAL:
${candidatesSummary}

Genera SOLO un JSON válido con esta estructura exacta:
{"plan_id":"${candidates.map(p=>p.id_tarifa).join('|')}","operador":"nombre del operador","tarifa":"nombre de la tarifa","motivo":"1-2 frases explicando por qué encaja con el perfil","cierre":"1 frase invitando a reservar, mencionando que FÍBARO tramita todo"}

Solo JSON. Sin texto adicional. Menciona siempre el operador real (${topPlan.operador}).`;

    try {
      const raw = await window.claude.complete(prompt);
      const match = raw.match(/\{[\s\S]*\}/);
      if (!match) throw new Error('No JSON');
      const parsed = JSON.parse(match[0]);
      const foundPlan = plans.find(p => p.id_tarifa === parsed.plan_id) || topPlan;
      setRec({ plan: foundPlan, motivo: parsed.motivo, cierre: parsed.cierre, alternatives: candidates.slice(1, 3) });
    } catch {
      setRec({ plan: topPlan, motivo: `Con tu perfil de ${ans.personas} y uso de ${ans.uso}, la tarifa ${topPlan.nombre_tarifa} de ${topPlan.operador} ofrece el mejor equilibrio.`, cierre: 'FÍBARO tramita todo el proceso con el operador. Solo tienes que reservar.', alternatives: candidates.slice(1, 3) });
    }

    setLoading(false);
    setStep('result');
  };

  const speedLabel = s => parseInt(s) >= 1000 ? `${parseInt(s)/1000} Gb` : `${s} Mb`;

  return (
    <>
      {open && <div className="ai-backdrop" onClick={onClose} style={{animation:'fadeIn .25s ease'}} />}
      <div className={`ai-panel ${open ? 'ai-panel-open' : 'ai-panel-closed'}`} role="dialog">
        {/* Header */}
        <div className="ai-header">
          <div className="ai-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="3" fill="white"/>
              <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="white" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
          </div>
          <div>
            <div style={{fontWeight:700,fontSize:'.9rem',color:'#fff'}}>Asistente FÍBARO</div>
            <div style={{fontSize:'.72rem',color:'rgba(255,255,255,.45)',display:'flex',alignItems:'center',gap:5,marginTop:1}}>
              <span style={{color:'#22C55E',fontSize:'.65rem'}}>●</span>
              {isDemoMode ? 'Modo demo' : 'Catálogo real activo'}
            </div>
          </div>
          <button onClick={onClose} style={{marginLeft:'auto',background:'rgba(255,255,255,.07)',border:'1px solid rgba(255,255,255,.1)',borderRadius:8,color:'rgba(255,255,255,.6)',width:30,height:30,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1rem',flexShrink:0,transition:'var(--transition)'}}>✕</button>
        </div>

        {/* Messages */}
        <div className="ai-body" ref={bodyRef}>
          {msgs.map((m, i) => (
            <div key={i} className={`ai-bubble ${m.role==='bot'?'ai-bubble-bot':'ai-bubble-user'}`} style={{animation:'fadeUp .25s ease both'}}>
              {m.text}
            </div>
          ))}

          {loading && (
            <div className="ai-bubble ai-bubble-bot">
              <div className="ai-typing" style={{display:'flex',gap:4}}>
                <span/><span/><span/>
              </div>
            </div>
          )}

          {/* Options for current question */}
          {!loading && step !== 'result' && step !== 'noresult' && questions[step] && (
            <div className="ai-opts" style={{animation:'fadeUp .28s ease both'}}>
              {questions[step].opts.map((opt, i) => (
                <button key={i} className="ai-opt" onClick={() => handleOpt(step, opt)}
                  style={{animationDelay:`${i*.05}s`}}>{opt}</button>
              ))}
            </div>
          )}

          {/* Recommendation result */}
          {step === 'result' && rec && (
            <div style={{animation:'fadeUp .35s ease both', display:'flex', flexDirection:'column', gap:10}}>
              <div className="ai-bubble ai-bubble-bot">{rec.motivo}</div>
              <div className="ai-rec-card">
                {/* Operator badge */}
                {(() => {
                  const op = (rec.plan.operador||'').toUpperCase();
                  const oc = (window.OP_COLORS||{})[op] || {color:'#64748B',bg:'rgba(100,116,139,.1)',border:'rgba(100,116,139,.22)'};
                  return (
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                      <span style={{fontSize:'.7rem',fontWeight:800,letterSpacing:'.05em',textTransform:'uppercase',color:oc.color,background:oc.bg,border:`1px solid ${oc.border}`,padding:'3px 10px',borderRadius:6}}>
                        {rec.plan.marca_comercial || rec.plan.operador}
                      </span>
                      <span style={{fontSize:'.7rem',color:'var(--cyan)',fontWeight:600}}>Recomendada</span>
                    </div>
                  );
                })()}
                <div style={{fontWeight:800,fontSize:'1rem',color:'#fff',marginBottom:3}}>{rec.plan.nombre_tarifa}</div>
                {rec.plan.fibra_mb && <div style={{fontSize:'.78rem',color:'var(--cyan)',fontWeight:600,marginBottom:10}}>{speedLabel(rec.plan.fibra_mb)} · {rec.plan.num_lineas_incluidas} línea{parseInt(rec.plan.num_lineas_incluidas)>1?'s':''} · €{parseFloat(rec.plan.precio_final||rec.plan.precio_tramo_1).toFixed(2)}/mes</div>}
                <div style={{fontSize:'.82rem',color:'rgba(255,255,255,.68)',lineHeight:1.55,marginBottom:14}}>{rec.cierre}</div>
                <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',fontSize:'.85rem'}} onClick={() => { onPreorder(rec.plan, null); onClose(); }}>
                  Reservar esta tarifa →
                </button>
              </div>
              {rec.alternatives?.length > 0 && (
                <div style={{fontSize:'.78rem',color:'rgba(255,255,255,.45)',marginTop:2}}>
                  También podrían interesarte:{' '}
                  {rec.alternatives.map((p,i) => (
                    <button key={i} onClick={() => { onPreorder(p, null); onClose(); }}

                      {p.nombre_tarifa}
                    </button>
                  ))}
                </div>
              )}
              <div style={{display:'flex',gap:7,flexWrap:'wrap',marginTop:4}}>
                <button className="ai-opt" style={{fontSize:'.75rem'}} onClick={() => {
                  setStep('q1'); setAnswers({}); setMsgs([{role:'bot',text:questions.q1.text}]); setRec(null);
                }}>Repetir test</button>
                <button className="ai-opt" style={{fontSize:'.75rem'}} onClick={onClose}>Ver catálogo completo</button>
              </div>
            </div>
          )}
        </div>

        <div className="ai-footer">
          <p style={{fontSize:'.7rem',color:'rgba(255,255,255,.28)',textAlign:'center',lineHeight:1.5}}>
            El asistente usa únicamente tarifas del catálogo oficial importado. No inventa precios ni condiciones. FÍBARO actúa como asesor, no como operador.
          </p>
        </div>
      </div>
    </>
  );
}

// ── Lines Calculator Modal ──
function LinesCalcModal({ plan, lineas, onClose, onPreorder }) {
  const included = parseInt(plan.num_lineas_incluidas) || 0;
  const [totalLines, setTotalLines] = React.useState(included + 1);
  const [selectedLineOpt, setSelectedLineOpt] = React.useState(null);

  const extraNeeded = Math.max(0, totalLines - included);
  const { lines: opts, matchType } = window.findLineasAdicionales(plan, lineas);

  React.useEffect(() => {
    if (opts.length > 0 && !selectedLineOpt) setSelectedLineOpt(opts[0].id_linea_adicional);
  }, [opts]);

  const selectedOpt = opts.find(o => o.id_linea_adicional === selectedLineOpt);
  const pricePerLine = selectedOpt ? parseFloat(selectedOpt.precio_final) : null;
  const basePrice = parseFloat(plan.precio_tramo_1) || parseFloat(plan.precio_final) || 0;
  const extraCost = (pricePerLine !== null && extraNeeded > 0) ? pricePerLine * extraNeeded : null;
  const totalPrice = (extraCost !== null) ? basePrice + extraCost : null;

  const matchLabels = { id:'coincidencia exacta por tarifa', familia:'coincidencia por familia de tarifa', subfamilia:'por subfamilia', operador:'opciones generales del operador', none:'' };

  const calcResult = selectedOpt && extraNeeded > 0 ? {
    basePrice, extraNeeded, pricePerLine, extraCost, totalPrice,
    lineName: selectedOpt.nombre_opcion_linea,
    gbPerLine: selectedOpt.gb_linea_adicional,
    matchType,
  } : null;

  return (
    <div className="modal-overlay" onClick={e => { if(e.target===e.currentTarget) onClose(); }}>
      <div className="modal-box">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
          <div>
            <h3 style={{fontSize:'1.3rem',fontWeight:800,letterSpacing:'-.02em',color:'var(--ink)'}}>Calcular líneas adicionales</h3>
            <p style={{fontSize:'.82rem',color:'#64748B',marginTop:4}}>{plan.nombre_tarifa}</p>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:'1.4rem',color:'#94A3B8',padding:'4px 8px'}}>✕</button>
        </div>

        {/* Included lines info */}
        <div style={{background:'var(--off-white)',borderRadius:10,padding:'12px 16px',marginBottom:16,fontSize:'.85rem',color:'#374151'}}>
          <strong>Líneas incluidas en esta tarifa: {included}</strong>
          {plan.gb_linea_principal && <span style={{color:'#64748B'}}> · {plan.gb_linea_principal} GB por línea</span>}
        </div>

        {/* Total lines selector */}
        <div className="form-group">
          <label className="form-label">¿Cuántas líneas necesitas en total?</label>
          <div style={{display:'flex',alignItems:'center',gap:12}}>
            <button onClick={()=>setTotalLines(t=>Math.max(included+1,t-1))} className="btn btn-outline btn-sm" style={{width:36,padding:'8px',justifyContent:'center'}}>−</button>
            <span style={{fontSize:'1.4rem',fontWeight:800,minWidth:32,textAlign:'center'}}>{totalLines}</span>
            <button onClick={()=>setTotalLines(t=>t+1)} className="btn btn-outline btn-sm" style={{width:36,padding:'8px',justifyContent:'center'}}>+</button>
            <span style={{fontSize:'.82rem',color:'#64748B'}}>({extraNeeded} extra{extraNeeded!==1?'s':''} sobre las {included} incluidas)</span>
          </div>
        </div>

        {/* Line options */}
        {opts.length === 0 ? (
          <div className="revision-warn">
            <strong>Revisión comercial requerida</strong><br/>
            No se han encontrado opciones de línea adicional para esta tarifa en el catálogo actual. Nuestro equipo te dará precio exacto al llamarte.
          </div>
        ) : (
          <>
            <div className="form-group">
              <label className="form-label">Elige el tipo de línea adicional ({matchLabels[matchType]})</label>
              <div className="lines-options">
                {opts.map(opt => {
                  const price = parseFloat(opt.precio_final);
                  const free = price === 0;
                  return (
                    <div key={opt.id_linea_adicional}
                      className={`lines-opt-card ${selectedLineOpt===opt.id_linea_adicional?'selected':''}`}
                      onClick={()=>setSelectedLineOpt(opt.id_linea_adicional)}
                      style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}
                    >
                      <div>
                        <div style={{fontWeight:700,fontSize:'.88rem',color:'var(--ink)'}}>{opt.nombre_opcion_linea || `${opt.gb_linea_adicional} GB`}</div>
                        <div style={{fontSize:'.75rem',color:'#94A3B8',marginTop:2}}>
                          {opt.gb_linea_adicional} GB · {opt.llamadas_movil_linea_adicional||'según tarifa'}
                          {opt.comparte_gb==='sí' && ' · GB compartidos'}
                        </div>
                      </div>
                      <div style={{textAlign:'right',flexShrink:0,marginLeft:16}}>
                        <div style={{fontWeight:800,fontSize:'1rem',color: free?'#059669':'var(--blue)'}}>
                          {free ? 'Gratis' : `€${price.toFixed(2)}/línea`}
                        </div>
                        {extraNeeded > 1 && !free && <div style={{fontSize:'.7rem',color:'#94A3B8'}}>×{extraNeeded} = €{(price*extraNeeded).toFixed(2)}</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Price summary */}
            {extraNeeded > 0 && selectedOpt && (
              <div className="lines-summary">
                <div className="lines-sum-row">
                  <span>Tarifa base ({plan.nombre_tarifa})</span>
                  <span>€{basePrice.toFixed(2)}/mes</span>
                </div>
                <div className="lines-sum-row">
                  <span>{included} línea{included!==1?'s':''} incluida{included!==1?'s':''}</span>
                  <span style={{color:'#059669'}}>Incluidas</span>
                </div>
                <div className="lines-sum-row">
                  <span>{extraNeeded} línea{extraNeeded!==1?'s':''} extra × {pricePerLine===0?'gratis':`€${pricePerLine?.toFixed(2)}`}</span>
                  <span>{extraCost===0?'€0,00':`€${extraCost?.toFixed(2)}/mes`}</span>
                </div>
                <div className="lines-sum-row" style={{paddingTop:10,marginTop:6,borderTop:'1px solid var(--border-light)'}}>
                  <span>Total estimado ({totalLines} líneas)</span>
                  <span style={{color:'var(--blue)',fontSize:'1.1rem'}}>€{totalPrice?.toFixed(2)}/mes</span>
                </div>
                <p style={{fontSize:'.7rem',color:'#94A3B8',marginTop:8,lineHeight:1.4}}>
                  {(plan.iva_incluido||'').toLowerCase()==='sí' ? 'IVA incluido' : '+IVA'} · Precio según catálogo {plan.operador} · Sujeto a cobertura y condiciones del operador
                </p>
              </div>
            )}
          </>
        )}

        <div style={{display:'flex',gap:10,marginTop:20,flexWrap:'wrap'}}>
          <button className="btn btn-outline" style={{flex:1,justifyContent:'center'}} onClick={onClose}>Volver al catálogo</button>
          <button className="btn btn-primary" style={{flex:2,justifyContent:'center'}} onClick={() => onPreorder(plan, calcResult)}>
            Reservar con {totalLines} líneas →
          </button>
        </div>
      </div>
    </div>
  );
}

              <div className="form-group">
                <label className="form-label">Líneas deseadas</label>
                <input className="form-input" type="number" min="1" placeholder="Nº de líneas" value={form.lineas_total} onChange={e=>set('lineas_total',e.target.value)}/>
              </div>
              <div className="form-group" style={{gridColumn:'1/-1'}}>
                <label className="form-label">Dirección de instalación *</label>
                <input className="form-input" type="text" placeholder="Calle, número, localidad" value={form.direccion} onChange={e=>set('direccion',e.target.value)} required/>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Comentario (opcional)</label>
              <textarea className="form-input" placeholder="¿Alguna duda o aclaración?" value={form.comentario} onChange={e=>set('comentario',e.target.value)} rows={2}/>
            </div>

            {/* Hidden: fecha/hora */}
            <input type="hidden" value={now}/>

            <button type="submit" className="btn btn-primary btn-lg" disabled={!isValid||sending} style={{width:'100%',justifyContent:'center',opacity:(!isValid||sending)?.6:1}}>
              {sending ? (
                <><span style={{width:16,height:16,border:'2px solid rgba(255,255,255,.4)',borderTop:'2px solid #fff',borderRadius:'50%',animation:'ringRot .7s linear infinite',display:'inline-block'}}/> Enviando…</>
              ) : 'Enviar prepedido →'}
            </button>

            <div className="modal-note">
              <strong style={{color:'var(--ink)'}}>Sin compromiso.</strong> Este prepedido no es un contrato. FÍBARO verificará tu cobertura y te llamará para tramitar el alta con el operador elegido, cuando tú lo decidas.
            </div>
          </form>
        )}
      </div>
    </div>
  );
}

// Expose OP_COLORS for use in AI component
window.OP_COLORS = {
  MASMOVIL:  { color:'#EA580C', bg:'rgba(234,88,12,.1)',  border:'rgba(234,88,12,.22)'  },
  JAZZTEL:   { color:'#DC2626', bg:'rgba(220,38,38,.1)',  border:'rgba(220,38,38,.22)'  },
  SIMYO:     { color:'#0891B2', bg:'rgba(8,145,178,.1)',  border:'rgba(8,145,178,.22)'  },
  PEPEPHONE: { color:'#7C3AED', bg:'rgba(124,58,237,.1)', border:'rgba(124,58,237,.22)' },
  DEMO:      { color:'#64748B', bg:'rgba(100,116,139,.1)',border:'rgba(100,116,139,.22)'},
};

Object.assign(window, { FibaroAIV2, LinesCalcModal, PreorderModalV2 });

</script>

<script type="text/babel">
function App() {
  const [catalog, setCatalog] = React.useState(null); // null = no importado
  const [importMeta, setImportMeta] = React.useState(null);
  const [aiOpen, setAiOpen] = React.useState(false);
  const [preorderData, setPreorderData] = React.useState(null); // {plan, calcResult}
  const [calcData, setCalcData] = React.useState(null); // plan para calcular líneas
  const fileRef = React.useRef(null);

  const isDemoMode = catalog === null;
  const activePlans = isDemoMode ? window.DEMO_PLANS : catalog.plans;
  const activeLineas = catalog?.lineas || [];

  const handleFileSelect = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const result = await window.parseExcel(file);
      setCatalog(result);
      setImportMeta({ fileName: file.name, ...result.stats, warnings: result.warnings, operadores: result.operadores });
    } catch(err) {
      alert('Error al leer el Excel: ' + err.message);
    }
    e.target.value = '';
  };

  const openPreorder = (plan, calcResult) => setPreorderData({ plan, calcResult });
  const openCalc = (plan) => setCalcData(plan);

  return (
    <>
      <FibaroNavV2 onAiOpen={() => setAiOpen(true)} onImport={() => fileRef.current?.click()} />
      <input type="file" accept=".xlsx" ref={fileRef} className="import-file-input" onChange={handleFileSelect} />

      <ImportBanner
        isDemoMode={isDemoMode}
        importMeta={importMeta}
        onImportClick={() => fileRef.current?.click()}
      />

      <FibaroHeroV2 onAiOpen={() => setAiOpen(true)} isDemoMode={isDemoMode} />
      <FibaroTrustV2 />
      <CatalogSectionV2
        plans={activePlans}
        lineas={activeLineas}
        promos={catalog?.promos || []}
        isDemoMode={isDemoMode}
        onPreorder={openPreorder}
        onCalc={openCalc}
      />
      <FibaroProcessV2 />
      <FibaroFAQV2 />
      <FibaroCTAV2 onPreorder={() => openPreorder(null, null)} onAiOpen={() => setAiOpen(true)} />
      <FibaroFooterV2 />

      <button className="ai-fab" onClick={() => setAiOpen(true)} aria-label="Asistente IA">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="3" fill="white"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="white" strokeWidth="1.5" strokeLinecap="round"/>
        </svg>
      </button>

      <FibaroAIV2
        open={aiOpen}
        onClose={() => setAiOpen(false)}
        catalog={catalog}
        isDemoMode={isDemoMode}
        onPreorder={openPreorder}
      />

      {calcData && (
        <LinesCalcModal
          plan={calcData}
          lineas={activeLineas}
          onClose={() => setCalcData(null)}
          onPreorder={(plan, cr) => { setCalcData(null); openPreorder(plan, cr); }}
        />
      )}

      {preorderData !== null && (
        <PreorderModalV2
          plan={preorderData?.plan}
          calcResult={preorderData?.calcResult}
          onClose={() => setPreorderData(null)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
